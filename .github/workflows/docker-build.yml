name: 'Sub-workflow: Construcción de Contenedores'

on:
  workflow_call:

jobs:
  docker-build:
    name: 'Construir Contenedores'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Contenedor - auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: false

      - name: Construir Contenedor - inventory-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/inventory-service/Dockerfile
          push: false

      - name: Construir Contenedor - web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

      - name: Construir Contenedor - media-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/media-service/Dockerfile
          push: false
